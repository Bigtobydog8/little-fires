<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The colour the browser paints BEFORE any of this page exists.
     A cold start shows a blank canvas while the document is still being
     fetched, and its colour comes from the browser, not from us - so on a
     dark-mode phone it is dark, and a light-themed app opens with a dark
     flash. Nothing in the document can prevent that, because the document is
     not there yet. These two are the only things read early enough to matter.
     Biased to the app's own default rather than to the OS: a fresh install is
     light, and so is the most common setting. The script below still has the
     final say - it knows the STORED theme, which is the only correct answer -
     so a dark-themed install corrects within the same parse. The trade is that
     a dark install may show a pale frame instead of a dark one; that is the
     less common case and the gentler failure.
     KEEP IN SYNC with the two --bg-1 tokens. -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#faf9f5">
<style>html { background-color: #faf9f5; }</style>
<title>Little Fires</title>
<!-- Theme and font, resolved before first paint.
     Both used to be applied by passive effects in the app, which meant the
     first commit painted with the :root defaults (dark tokens, Quicksand and
     Nunito) and only corrected itself after the browser had shown that frame.
     For a non-default font it was worse: the family's <link> was appended
     after React mounted, so the real font arrived long after the app was
     interactive and popped in.
     Doing it here also means only the family actually in use is downloaded.
     A synchronous inline script in <head> starts that fetch during HTML
     parsing, so nothing waits on the bundle.
     KEEP IN SYNC with little-fires-app.jsx - the theme rules match the
     settings loader (no stored settings -> light, stored blob with no theme
     key -> system, parse failure -> light, 'system' follows the OS), the two
     colours are the themes' --bg-1 tokens, and FONTS mirrors FONT_OPTIONS.
     After mount the app's effects own these same properties, so switching
     theme or font in Settings cleans up after this script.
     tests/theme-boot-test.js pins every one of those couplings. -->
<script>
  (function () {
    var FONTS = {
      'default':  { ui: "'Quicksand', sans-serif", body: "'Nunito', sans-serif",
                    google: 'Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700' },
      'system':   { ui: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                    body: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                    google: null },
      'serif':    { ui: "'Lora', Georgia, serif", body: "'Inter', sans-serif",
                    google: 'Lora:wght@500;600;700&family=Inter:wght@400;500;600;700' },
      'mono':     { ui: "'Space Grotesk', sans-serif", body: "'Inter', sans-serif",
                    google: 'Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700' },
      'humanist': { ui: "'Nunito', sans-serif", body: "'Nunito', sans-serif",
                    google: 'Nunito:wght@400;500;600;700;800' }
    };
    try {
      var theme, fontChoice;
      try {
        var saved = localStorage.getItem('little_fires_settings');
        if (!saved) {
          // Fresh install: the app's DEFAULT_SETTINGS look.
          theme = 'light';
          fontChoice = 'serif';
        } else {
          var parsed = JSON.parse(saved);
          // A key missing from a stored blob means it was written before
          // these became fresh-install defaults, so hold that install on the
          // previous ones - the same pins the app's settings loader applies.
          theme = parsed.theme === undefined ? 'system' : parsed.theme;
          fontChoice = parsed.fontChoice === undefined ? 'default' : parsed.fontChoice;
        }
      } catch (err) {
        theme = 'light';
        fontChoice = 'serif';
      }

      var root = document.documentElement;

      var light = theme === 'light' || (
        theme === 'system' &&
        typeof window.matchMedia === 'function' &&
        window.matchMedia('(prefers-color-scheme: light)').matches
      );
      if (light) root.classList.add('theme-light');
      root.style.backgroundColor = light ? '#faf9f5' : '#1a1a2e';
      root.style.colorScheme = light ? 'light' : 'dark';

      // Resolve the id before using it: an unrecognised stored choice (an
      // older or newer settings blob) falls back to the default pairing, and
      // the link must be keyed by the family actually requested or the app's
      // effect won't find it and will request the same font again.
      var fontId = FONTS[fontChoice] ? fontChoice : 'default';
      var choice = FONTS[fontId];
      root.style.setProperty('--font-ui', choice.ui);
      root.style.setProperty('--font-body', choice.body);
      if (choice.google) {
        // Same id scheme the app's font effect uses, so it finds this link
        // already present and doesn't request the family a second time.
        var link = document.createElement('link');
        link.id = 'lf-font-' + fontId;
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=' + choice.google + '&display=swap';
        document.head.appendChild(link);
      }
    } catch (err) {
      /* Never let theming or fonts break the page. */
    }
  })();
</script>
<!-- Icons, declared statically rather than built at runtime.
     iOS reads the home-screen icon at the moment you tap "Add to Home Screen",
     which may be before any script has run - and it caches what it finds hard
     enough that a wrong icon survives a redeploy. A file on disk is the only
     version of this that is reliably there when it is looked for.
     apple-touch-icon has no size attribute on purpose: iOS picks the 180 one
     and scales, and a single declaration is one fewer thing to keep in sync. -->
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="manifest" href="/manifest.json">
<!-- After the boot script on purpose. The script is synchronous and must run
     as early as possible - every byte parsed before it is time the browser
     spends showing its own canvas instead of ours. preconnect losing a few
     milliseconds costs a font a moment; the script losing them costs a visible
     flash. gstatic is where the font files live and needs crossorigin. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap">
</noscript>
</head>
<body>
<div id="root"></div>
<script type="module" src="main.jsx"></script>
</body>
</html>
